# ---------------------------------------------------------------------------
# Applies the NEXUS schema and loads the demo dataset into a Postgres database.
#
# Run it from the Actions tab. The target is the `DATABASE_URL` repository
# secret, which should hold the Supabase connection string.
#
# Migrations are idempotent and are tracked in `schema_migrations`, so running
# this workflow repeatedly is safe: already-applied files are skipped. Seeding
# refuses to run against a database that already holds data unless `reset` is
# checked, which truncates every table first.
# ---------------------------------------------------------------------------
name: Database setup

on:
  workflow_dispatch:
    inputs:
      reset:
        description: 'Truncate every table before seeding (destroys existing data)'
        type: boolean
        default: false
      skip_seed:
        description: 'Apply migrations only, do not seed'
        type: boolean
        default: false

concurrency:
  # One write to the database at a time; a queued run would fight the one in
  # flight over the same tables.
  group: db-setup
  cancel-in-progress: false

jobs:
  setup:
    name: Migrate and seed
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate

      - name: Seed demo data
        if: ${{ !inputs.skip_seed }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm ${{ inputs.reset && 'seed:reset' || 'seed' }}
